<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- Canister Body Gradient -->
    <linearGradient id="bodyGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#3f3f46" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#27272a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Stage 3 Chemical Gradient -->
    <linearGradient id="chemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Stage 2 Bio Matrix Gradient -->
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Stage 1 Mechanical Gradient -->
    <linearGradient id="mechGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Inflow Water Tube Gradient -->
    <linearGradient id="inflowWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Outflow Clean Water Gradient -->
    <linearGradient id="outflowWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Technical Background -->
  <rect width="900" height="900" fill="url(#canBg)" rx="24" />

  <!-- Outer Technical Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,150 H900 M0,300 H900 M0,450 H900 M0,600 H900 M0,750 H900" />
    <path d="M150,0 V900 M300,0 V900 M450,0 V900 M600,0 V900 M750,0 V900" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 40)">
    <rect width="450" height="38" rx="19" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#3b82f6" />
    <text x="38" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">
      STRUKTUR &amp; ALIRAN MEDIA FILTER CANISTER
    </text>
  </g>

  <!-- INLET & OUTLET TUBES AT TOP -->
  <g transform="translate(250, 95)">
    <!-- INLET (DIRTY WATER IN) on LEFT -->
    <rect x="30" y="0" width="34" height="60" rx="6" fill="#18181b" stroke="#3b82f6" stroke-width="2" />
    <!-- Downward Arrow -->
    <path d="M47,15 L47,45 M40,36 L47,45 L54,36" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="47" y="-10" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">INLET</text>
    <text x="47" y="-24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Air Masuk</text>

    <!-- OUTLET (CLEAN WATER OUT) on RIGHT -->
    <rect x="330" y="0" width="34" height="60" rx="6" fill="#18181b" stroke="#10b981" stroke-width="2" />
    <!-- Upward Arrow -->
    <path d="M347,45 L347,15 M340,24 L347,15 L354,24" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="347" y="-10" fill="#34d399" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">OUTLET</text>
    <text x="347" y="-24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Air Bersih Kembali</text>
  </g>

  <!-- CANISTER HOUSING CUTAWAY (CENTER) -->
  <g transform="translate(250, 150)">
    <!-- Canister Head / Motor Impeller Unit -->
    <rect x="0" y="0" width="400" height="70" rx="14" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <!-- Impeller & Motor Core Icon -->
    <circle cx="347" cy="35" r="18" fill="#27272a" stroke="#10b981" stroke-width="2" />
    <path d="M347,23 V47 M335,35 H359 M339,27 L355,43 M339,43 L355,27" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <text x="200" y="40" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MOTOR HEAD &amp; IMPELLER</text>

    <!-- Main Canister Bucket Glass Body -->
    <rect x="10" y="70" width="380" height="600" rx="16" fill="url(#bodyGlass)" stroke="#71717a" stroke-width="3" />

    <!-- Inflow Internal Downpipe (Takes dirty water directly to bottom) -->
    <rect x="35" y="70" width="24" height="510" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Downward water stream particles -->
    <path d="M47,80 L47,560" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8,8" opacity="0.8" />
    <polygon points="40,560 54,560 47,575" fill="#38bdf8" />
    <text x="28" y="320" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" transform="rotate(-90,28,320)">PIPA INLET KE DASAR</text>

    <!-- ================= BASKET 3 (TOP): CHEMICAL FILTRATION ================= -->
    <g transform="translate(70, 90)">
      <rect width="305" height="110" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
      <!-- Chemical resin & carbon beads -->
      <rect x="6" y="6" width="293" height="98" rx="4" fill="url(#chemGrad)" fill-opacity="0.3" />
      <g fill="#fbbf24" opacity="0.6">
        <circle cx="30" cy="30" r="5" /><circle cx="70" cy="40" r="4.5" /><circle cx="120" cy="25" r="5" /><circle cx="170" cy="45" r="5" /><circle cx="220" cy="30" r="4.5" /><circle cx="270" cy="40" r="5" />
        <circle cx="45" cy="75" r="4.5" /><circle cx="95" cy="65" r="5" /><circle cx="145" cy="80" r="4" /><circle cx="195" cy="70" r="5" /><circle cx="245" cy="85" r="4.5" />
      </g>
      <!-- Label inside basket -->
      <rect x="15" y="15" width="275" height="30" rx="6" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="152" y="35" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">
        TAHAP 3: KIMIAWI (PURIGEN / KARBON)
      </text>
      <text x="152" y="70" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
        Menyerap tanin kuning, bau amis &amp; racun mikro
      </text>
    </g>

    <!-- Upward flow arrow between Basket 2 and Basket 3 -->
    <g transform="translate(220, 210)">
      <line x1="0" y1="20" x2="0" y2="0" stroke="#34d399" stroke-width="3" />
      <polygon points="-5,8 5,8 0,0" fill="#34d399" />
    </g>

    <!-- ================= BASKET 2 (MIDDLE, LARGEST): BIOLOGICAL MATRIX ================= -->
    <g transform="translate(70, 230)">
      <rect width="305" height="200" rx="8" fill="#18181b" stroke="#10b981" stroke-width="2.5" />
      <!-- Porous matrix & ceramic rings texture -->
      <rect x="6" y="6" width="293" height="188" rx="4" fill="url(#bioGrad)" fill-opacity="0.25" />
      <g fill="#10b981" opacity="0.6">
        <!-- Ceramic rings -->
        <circle cx="35" cy="35" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="85" cy="45" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="140" cy="30" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="195" cy="45" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="250" cy="35" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="55" cy="85" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="115" cy="95" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="170" cy="80" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="225" cy="95" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="275" cy="80" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="40" cy="140" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="95" cy="150" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="150" cy="135" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="205" cy="150" r="9" fill="none" stroke="#34d399" stroke-width="3" />
        <circle cx="260" cy="140" r="9" fill="none" stroke="#34d399" stroke-width="3" />
      </g>
      <!-- Label inside basket -->
      <rect x="15" y="15" width="275" height="34" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <text x="152" y="37" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">
        TAHAP 2: BIOLOGIS (MATRIX / CERAMIC)
      </text>
      <text x="152" y="70" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
        VOLUME TERLUAS (70% KAPASITAS)
      </text>
      <text x="152" y="115" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
        Hunian jutaan bakteri pengurai amonia &amp; nitrit
      </text>
      <text x="152" y="175" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
        *DILARANG CUCI DENGAN AIR KRAN BERKAPORIT!
      </text>
    </g>

    <!-- Upward flow arrow between Basket 1 and Basket 2 -->
    <g transform="translate(220, 440)">
      <line x1="0" y1="20" x2="0" y2="0" stroke="#38bdf8" stroke-width="3" />
      <polygon points="-5,8 5,8 0,0" fill="#38bdf8" />
    </g>

    <!-- ================= BASKET 1 (BOTTOM): MECHANICAL FILTRATION ================= -->
    <g transform="translate(70, 465)">
      <rect width="305" height="130" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="2.5" />
      <!-- Coarse sponge & dacron texture -->
      <rect x="6" y="6" width="293" height="60" rx="4" fill="#1e3a8a" fill-opacity="0.5" />
      <!-- Dacron white floss layer -->
      <rect x="6" y="68" width="293" height="56" rx="4" fill="#e2e8f0" fill-opacity="0.3" />
      <!-- Label inside basket -->
      <rect x="15" y="12" width="275" height="32" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <text x="152" y="33" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">
        TAHAP 1: MEKANIS (BUSA KASAR + DACRON)
      </text>
      <text x="152" y="65" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
        Menyaring kotoran fisik kasar &amp; serpihan daun
      </text>
      <text x="152" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
        Melindungi pori rumah bakteri agar tidak tersumbat!
      </text>
    </g>

    <!-- Bottom Water Turnaround Curve -->
    <path d="M47,590 Q47,640 100,640 L340,640 Q370,640 370,600" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6" opacity="0.7" />
    <polygon points="364,615 376,615 370,600" fill="#38bdf8" />
  </g>

  <!-- LEFT CALLOUT: FLOW PRINCIPLE -->
  <g transform="translate(50, 400)">
    <rect width="180" height="180" rx="14" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="900">PRINSIP ALIRAN</text>
    <text x="20" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Dari Bawah</text>
    <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Naik ke Atas</text>
    <text x="20" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" leading="14">
      Air kotor masuk ke dasar canister terlebih dahulu, lalu didorong naik melewati 3 tahap pembersihan.
    </text>
  </g>

  <!-- RIGHT CALLOUT: 3 STAGES BADGES -->
  <g transform="translate(680, 220)">
    <!-- Stage 3 Tag -->
    <rect width="170" height="90" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="28" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="900">03. KIMIAWI</text>
    <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Air Sebening Kristal</text>
    <text x="15" y="70" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="9">Purigen / Karbon Aktif</text>
  </g>

  <g transform="translate(680, 370)">
    <!-- Stage 2 Tag -->
    <rect width="170" height="110" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <text x="15" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="900">02. BIOLOGIS</text>
    <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Jantung Pengurai</text>
    <text x="15" y="68" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">Matrix / Ceramic Rings</text>
    <text x="15" y="90" fill="#e2e8f0" font-family="monospace" font-size="9" font-weight="bold">Turnover 8x–12x Tank</text>
  </g>

  <g transform="translate(680, 560)">
    <!-- Stage 1 Tag -->
    <rect width="170" height="90" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="28" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="900">01. MEKANIS</text>
    <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pintu Masuk Pertama</text>
    <text x="15" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Bio-Foam + Kapas Putih</text>
  </g>
</svg>
