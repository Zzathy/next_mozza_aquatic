<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Layer 4: Soil Slope Gradient -->
    <linearGradient id="soilSlope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Layer 3: Base Fertilizer Gradient -->
    <linearGradient id="fertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Layer 2: Pumice Gradient -->
    <linearGradient id="pumiceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <!-- Layer 1: Bacteria Starter Gradient -->
    <linearGradient id="bacGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass Glow -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Minimal Background -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Technical Grid Subtle Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M0,400 H1200 M0,500 H1200 M0,600 H1200 M0,700 H1200" />
    <path d="M150,0 V800 M300,0 V800 M450,0 V800 M600,0 V800 M750,0 V800 M900,0 V800 M1050,0 V800" />
  </g>

  <!-- HEADER BADGE: BOLD & CRISP -->
  <g transform="translate(60, 40)">
    <rect width="440" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#10b981" filter="url(#glow)" />
    <text x="44" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">
      FONDASI STRUKTUR 5 LAPISAN SUBSTRAT
    </text>
  </g>

  <!-- TOP SLOPE ANNOTATION BANNER: LARGE & UNMISTAKABLE -->
  <g transform="translate(60, 105)">
    <rect width="1080" height="54" rx="14" fill="#1c2420" stroke="#10b981" stroke-width="2" />
    <path d="M40,27 L80,27 M70,20 L80,27 L70,34" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="95" y="34" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="900" letter-spacing="1">
      ATURAN KEMIRINGAN LERENG: DEPAN 3–4 CM  ➜  BELAKANG 7–10 CM (ILUSI DEPTH)
    </text>
  </g>

  <!-- TANK CROSS-SECTION CONTAINER -->
  <g transform="translate(60, 190)">
    <!-- Tank Glass Wall Box -->
    <rect x="0" y="0" width="1080" height="550" rx="16" fill="url(#glass)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
    
    <!-- Water surface -->
    <line x1="10" y1="50" x2="1070" y2="50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,8" stroke-opacity="0.7" />
    <text x="30" y="40" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">Level Air Tangki (~90%)</text>

    <!-- ================= LAYER 04: AQUA SOIL AKTIF (SLOPE) ================= -->
    <!-- Front starts at y=400 (height 140px), Back starts at y=230 (height 310px) -->
    <path d="M0,400 L1080,230 L1080,540 L0,540 Z" fill="url(#soilSlope)" stroke="#52525b" stroke-width="2" />

    <!-- Soil Granules Visual Texture -->
    <g fill="#3f3f46" opacity="0.6">
      <circle cx="60" cy="450" r="6" /><circle cx="140" cy="460" r="5" /><circle cx="220" cy="440" r="6.5" />
      <circle cx="340" cy="420" r="6" /><circle cx="460" cy="390" r="5" /><circle cx="580" cy="350" r="6.5" />
      <circle cx="700" cy="320" r="6" /><circle cx="820" cy="290" r="5.5" /><circle cx="940" cy="270" r="6" /><circle cx="1020" cy="250" r="5" />
      <circle cx="100" cy="480" r="5" /><circle cx="260" cy="470" r="6" /><circle cx="400" cy="440" r="5.5" /><circle cx="530" cy="400" r="6" />
      <circle cx="670" cy="370" r="5" /><circle cx="800" cy="340" r="6" /><circle cx="920" cy="310" r="5" /><circle cx="1040" cy="290" r="6" />
    </g>

    <!-- LAYER 04 BANNER & TEXT (VERY BOLD) -->
    <g transform="translate(40, 360)">
      <rect width="400" height="42" rx="10" fill="#18181b" stroke="#71717a" stroke-width="2" />
      <rect x="0" y="0" width="46" height="42" rx="10" fill="#27272a" />
      <text x="23" y="27" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">04</text>
      <text x="60" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
        AQUA SOIL AKTIF VULKANIK
      </text>
    </g>

    <!-- ================= LAYER 03: PUPUK DASAR (BASE FERTILIZER) ================= -->
    <rect x="0" y="475" width="1080" height="30" fill="url(#fertGrad)" stroke="#b45309" stroke-width="1.5" />
    <g fill="#78350f" opacity="0.6">
      <circle cx="50" cy="490" r="4" /><circle cx="150" cy="490" r="3.5" /><circle cx="250" cy="490" r="4" /><circle cx="350" cy="490" r="4.5" />
      <circle cx="450" cy="490" r="4" /><circle cx="550" cy="490" r="3.5" /><circle cx="650" cy="490" r="4" /><circle cx="750" cy="490" r="4" />
      <circle cx="850" cy="490" r="3.5" /><circle cx="950" cy="490" r="4" /><circle cx="1030" cy="490" r="4" />
    </g>
    <!-- Layer 03 Label -->
    <g transform="translate(40, 470)">
      <rect width="360" height="36" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
      <rect x="0" y="0" width="42" height="36" rx="8" fill="#451a03" />
      <text x="21" y="24" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="900" text-anchor="middle">03</text>
      <text x="54" y="23" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
        PUPUK DASAR SLOW-RELEASE
      </text>
    </g>

    <!-- ================= LAYER 02: PUMICE / RUMAH BAKTERI ================= -->
    <rect x="0" y="505" width="1080" height="25" fill="url(#pumiceGrad)" stroke="#3f3f46" stroke-width="1.5" />
    <g fill="#27272a" opacity="0.7">
      <ellipse cx="80" cy="517" rx="8" ry="4" /><ellipse cx="220" cy="517" rx="7" ry="4" /><ellipse cx="380" cy="517" rx="9" ry="4" />
      <ellipse cx="540" cy="517" rx="7" ry="4" /><ellipse cx="680" cy="517" rx="8" ry="4" /><ellipse cx="820" cy="517" rx="7" ry="4" />
      <ellipse cx="980" cy="517" rx="9" ry="4" />
    </g>
    <!-- Layer 02 Label -->
    <g transform="translate(460, 498)">
      <rect width="380" height="34" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width="2" />
      <rect x="0" y="0" width="40" height="34" rx="8" fill="#18181b" />
      <text x="20" y="23" fill="#e4e4e7" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">02</text>
      <text x="52" y="22" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
        RUMAH BAKTERI (PUMICE PORUS)
      </text>
    </g>

    <!-- ================= LAYER 01: BAKTERI STARTER DASAR KACA ================= -->
    <rect x="0" y="530" width="1080" height="15" fill="url(#bacGrad)" stroke="#047857" stroke-width="1.5" />
    <g fill="#a7f3d0">
      <circle cx="40" cy="537" r="2.5" /><circle cx="120" cy="537" r="2" /><circle cx="200" cy="537" r="2.5" /><circle cx="320" cy="537" r="2" />
      <circle cx="440" cy="537" r="2.5" /><circle cx="560" cy="537" r="2" /><circle cx="680" cy="537" r="2.5" /><circle cx="800" cy="537" r="2" />
      <circle cx="920" cy="537" r="2.5" /><circle cx="1020" cy="537" r="2" />
    </g>
    <!-- Layer 01 Label -->
    <g transform="translate(40, 522)">
      <rect width="360" height="32" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <rect x="0" y="0" width="38" height="32" rx="8" fill="#022c22" />
      <text x="19" y="21" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">01</text>
      <text x="48" y="21" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
        BUBUK BAKTERI STARTER (KACA DASAR)
      </text>
    </g>

    <!-- Solid Glass Bottom Bar -->
    <line x1="0" y1="545" x2="1080" y2="545" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- HUGE SLOPE MEASUREMENT ARROWS -->
    <!-- Front Dimension: 3-4 cm -->
    <g transform="translate(-25, 400)">
      <line x1="0" y1="0" x2="0" y2="145" stroke="#10b981" stroke-width="4" />
      <polygon points="-6,10 0,0 6,10" fill="#10b981" />
      <polygon points="-6,135 0,145 6,135" fill="#10b981" />
      <rect x="-140" y="55" width="130" height="36" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <text x="-75" y="79" fill="#a7f3d0" font-family="monospace" font-size="15" font-weight="900" text-anchor="middle">3–4 cm</text>
    </g>

    <!-- Back Dimension: 7-10 cm -->
    <g transform="translate(1105, 230)">
      <line x1="0" y1="0" x2="0" y2="315" stroke="#10b981" stroke-width="4" />
      <polygon points="-6,10 0,0 6,10" fill="#10b981" />
      <polygon points="-6,305 0,315 6,305" fill="#10b981" />
      <rect x="15" y="140" width="150" height="42" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <text x="90" y="167" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">7–10 cm</text>
    </g>
  </g>
</svg>
