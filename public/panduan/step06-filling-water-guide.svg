<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="tankBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Water flow gradient -->
    <linearGradient id="waterStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="soilCut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Plastic sheet translucent -->
    <linearGradient id="plasticGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#tankBg)" />

  <!-- Title Badge -->
  <g transform="translate(60, 45)">
    <rect width="360" height="34" rx="17" fill="#27272a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      TEKNIK PENGISIAN AIR ANTI-KERUH
    </text>
  </g>

  <!-- Main Aquarium Tank Cutaway Frame -->
  <g transform="translate(80, 110)">
    <!-- Tank Glass Container -->
    <rect x="0" y="0" width="840" height="420" rx="12" fill="#0369a1" fill-opacity="0.08" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />

    <!-- Substrate at Bottom -->
    <path d="M0,320 L840,240 L840,420 L0,420 Z" fill="url(#soilCut)" stroke="#3f3f46" stroke-width="2" />

    <!-- Hardscape Rocks & Wood in Background -->
    <path d="M220,300 L290,160 L380,180 L440,280 Z" fill="#3f3f46" stroke="#52525b" stroke-width="2" />
    <path d="M520,270 L600,140 L690,190 L740,250 Z" fill="#27272a" stroke="#3f3f46" stroke-width="2" />

    <!-- Planted Flora Shoots -->
    <g stroke="#10b981" stroke-width="2.5" fill="#059669" fill-opacity="0.7">
      <path d="M120,310 C120,260 110,230 115,200 C130,220 140,250 135,310 Z" />
      <path d="M160,305 C160,270 170,240 165,220 C150,240 145,270 155,305 Z" />
      <path d="M480,275 C480,230 490,200 485,180 C470,200 465,240 475,275 Z" />
    </g>

    <!-- THE PLASTIC SHEET (Protective Barrier) -->
    <path d="M40,280 Q250,260 450,250 T800,210 L800,240 Q450,270 40,300 Z" fill="url(#plasticGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />

    <!-- Water Hose / Siphon Pipe -->
    <path d="M420,-60 L420,160" stroke="#71717a" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M420,-60 L420,160" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Flowing Water onto Plastic Stream -->
    <path d="M414,160 L410,245 Q420,255 450,252 L426,160 Z" fill="url(#waterStream)" />
    
    <!-- Water Splashing Gently onto Plastic -->
    <ellipse cx="430" cy="252" rx="60" ry="10" fill="#38bdf8" fill-opacity="0.4" />
    <circle cx="390" cy="245" r="3" fill="#bae6fd" />
    <circle cx="470" cy="248" r="4" fill="#bae6fd" />
    <circle cx="440" cy="238" r="2.5" fill="#bae6fd" />

    <!-- Rising Gentle Water Level Indicator -->
    <line x1="20" y1="200" x2="820" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,8" opacity="0.8" />
    <text x="30" y="192" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Level Air Mengisi Pelan (Jernih Tanpa Lumpur)</text>
  </g>

  <!-- Left Callout Box: Trik Sukses -->
  <g transform="translate(80, 560)">
    <rect width="400" height="60" rx="12" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#064e3b" />
    <path d="M20,30 L24,34 L32,24" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="48" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Trik Sukses: Aliran di Atas Plastik</text>
    <text x="48" y="46" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Daya bentur air diserap plastik sehingga butiran soil tetap tenang.</text>
  </g>

  <!-- Right Callout Box: Bahaya Langsung -->
  <g transform="translate(520, 560)">
    <rect width="400" height="60" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#450a0a" />
    <path d="M20,25 L30,35 M30,25 L20,35" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Dilarang: Kucuran Air Langsung</text>
    <text x="48" y="46" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Kucuran keras mengaduk pupuk dasar &amp; tanah menjadi lumpur keruh.</text>
  </g>
</svg>
